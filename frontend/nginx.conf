server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver.
    # Setting upstream targets via variables forces Nginx to re-resolve hostnames
    # on every request instead of at startup, so the container starts successfully
    # even when backend services are temporarily unavailable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://car-reselling-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        # set must come BEFORE rewrite: rewrite...break stops all subsequent
        # ngx_http_rewrite_module directives (including set), so the variable
        # must already be initialized when the rewrite fires.
        set $auth_upstream http://authentication-api:8080;

        # Strip the /auth/ prefix so the backend receives /api/auth/...
        # When proxy_pass uses a variable, Nginx does NOT strip the location
        # prefix automatically — the rewrite directive must do it explicitly.
        rewrite ^/auth/(.*) /$1 break;

        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rewrite Origin to match FRONTEND_URL=http://localhost so the auth
        # service CORS filter accepts requests from any host port (80, 5173…).
        proxy_set_header Origin "http://localhost";
    }

    location / {
        try_files $uri /index.html;
    }
}
