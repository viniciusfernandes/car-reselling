# ============================================================
# Observability Stack — Kubernetes Manifests
# ============================================================
#
# Services:   Grafana · Loki · Tempo · Prometheus · OTel Collector
# Namespace:  observability
# Cluster:    kind single-node cluster named "grafana"
# Images:     exact versions from docker-compose-observality.yml
#
# Resources defined here (in order):
#   1.  Namespace
#   ── ConfigMaps (config files injected as volumes) ──────────
#   2.  prometheus-config        prometheus.yml
#   3.  loki-config              loki-config.yml
#   4.  tempo-config             tempo-config.yml
#   5.  otel-collector-config    otel-collector-config.yml
#   6.  grafana-datasources      grafana/provisioning/datasources/datasources.yml
#   7.  grafana-plugins          grafana/provisioning/plugins/plugins.yml
#   ── PersistentVolumeClaims ─────────────────────────────────
#   8.  grafana-pvc    (1 Gi  — dashboard state)
#   9.  loki-pvc       (5 Gi  — log chunks + index)
#   10. tempo-pvc      (5 Gi  — trace blocks + WAL)
#   11. prometheus-pvc (10 Gi — time-series data)
#   ── Loki ───────────────────────────────────────────────────
#   12. Deployment: loki
#   13. Service:    loki  (NodePort 30100 → host 3100)
#   ── Tempo ──────────────────────────────────────────────────
#   14. Deployment: tempo
#   15. Service:    tempo (NodePort 30200 → host 3200)
#   ── Prometheus ─────────────────────────────────────────────
#   16. Deployment: prometheus
#   17. Service:    prometheus (NodePort 30090 → host 9090)
#   ── OTel Collector ─────────────────────────────────────────
#   18. Deployment: otel-collector
#   19. Service:    otel-collector
#                   (NodePort 30317 → host 4317 gRPC)
#                   (NodePort 30318 → host 4318 HTTP)
#                   (NodePort 30888 → host 8888 self-telemetry)
#                   (NodePort 30889 → host 8889 app metrics)
#   ── Grafana ────────────────────────────────────────────────
#   20. Deployment: grafana
#   21. Service:    grafana (NodePort 30000 → host 3000)
#
# ── Quick-start ──────────────────────────────────────────────
#
#  1. Create cluster:
#       kind create cluster \
#         --config kubernetes/observability-cluster.yml \
#         --name grafana
#
#  2. Pre-load images into the cluster nodes (avoids Docker Hub
#     pull at pod-start time — faster and works offline):
#       kind load docker-image grafana/grafana:12.4.0-22081664032          --name grafana
#       kind load docker-image grafana/loki:3.2.0                          --name grafana
#       kind load docker-image grafana/tempo:2.6.1                         --name grafana
#       kind load docker-image prom/prometheus:v2.54.1                     --name grafana
#       kind load docker-image otel/opentelemetry-collector-contrib:0.96.0 --name grafana
#
#  3. Deploy:
#       kubectl apply -f kubernetes/observability-deployment.yml \
#         --context kind-grafana
#
#  4. Watch pods come up:
#       kubectl get pods -n observability -w --context kind-grafana
#
#  5. Access (NodePort → localhost via kind extraPortMappings):
#       Grafana         http://localhost:3000   (admin / admin)
#       Prometheus      http://localhost:9090
#       Loki push API   http://localhost:3100
#       Tempo query     http://localhost:3200
#       OTel gRPC           localhost:4317
#       OTel HTTP       http://localhost:4318
#
#  6. Point car-reselling-api at this cluster:
#       LOKI_URL=http://localhost:3100
#       OTLP_METRICS_URL=http://localhost:4318/v1/metrics
#       OBSERVABILITY_OTLP_ENDPOINT=http://localhost:4317
# ============================================================

---
# ── 1. Namespace ──────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: observability

---
# ── 2. ConfigMap: Prometheus ──────────────────────────────────────
# Mirrors prometheus.yml exactly.
# Scrape targets use Kubernetes service names (otel-collector)
# which resolve correctly within the observability namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # OTel Collector self-telemetry (pipeline health metrics)
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector:8888"]

      # Application metrics re-exposed by the OTel Collector
      - job_name: "otel-collector-app-metrics"
        honor_labels: true
        static_configs:
          - targets: ["otel-collector:8889"]

---
# ── 3. ConfigMap: Loki ────────────────────────────────────────────
# Mirrors loki-config.yml exactly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      log_level: info

    common:
      path_prefix: /loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 180h
      max_query_length: 0
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: filesystem

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/tsdb-chunks

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      alertmanager_url: ""

---
# ── 4. ConfigMap: Tempo ───────────────────────────────────────────
# Mirrors tempo-config.yml exactly.
# remote_write points to the prometheus service name — works in k8s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  config.yml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 180h

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: local
      storage:
        path: /tmp/tempo/generator/wal
        remote_write:
          - url: http://prometheus:9090/api/v1/write
            send_exemplars: true

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
          generate_native_histograms: both

---
# ── 5. ConfigMap: OTel Collector ─────────────────────────────────
# Mirrors otel-collector-config.yml exactly, plus adds the
# health_check extension so the readinessProbe can use HTTP.
# Exporter hostnames (loki, tempo, prometheus) match k8s service names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

      transform/resource_to_labels:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["service_name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

    exporters:
      debug:
        verbosity: detailed
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889

    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [loki, debug]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch, transform/resource_to_labels]
          exporters: [prometheus]

---
# ── 6. ConfigMap: Grafana datasources ────────────────────────────
# Mirrors grafana/provisioning/datasources/datasources.yml exactly.
# URLs use k8s service names — they resolve within the namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: true

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        isDefault: false
        editable: true

      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
# ── 7. ConfigMap: Grafana plugins ────────────────────────────────
# Mirrors grafana/provisioning/plugins/plugins.yml exactly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-plugins
  namespace: observability
data:
  plugins.yml: |
    apiVersion: 1

    apps:
      - type: grafana-lokiexplore-app
        disabled: false
        jsonData:
          lokiDatasourceUid: loki

      - type: grafana-exploretraces-app
        disabled: false
        jsonData:
          tempoDatasourceUid: tempo

---
# ── 8. PVC: Grafana ───────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
# ── 9. PVC: Loki ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
# ── 10. PVC: Tempo ────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-pvc
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
# ── 11. PVC: Prometheus ───────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
# ── 12. Deployment: Loki ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsUser: 0   # matches user: "0" in docker-compose-observality.yml
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/loki/local-config.yaml"
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/loki/local-config.yaml
              subPath: local-config.yaml
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-pvc

---
# ── 13. Service: Loki ─────────────────────────────────────────────
# NodePort 30100 → host port 3100 (via kind extraPortMappings)
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels:
    app: loki
spec:
  type: NodePort
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30100

---
# ── 14. Deployment: Tempo ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      securityContext:
        runAsUser: 0   # matches user: "0" in docker-compose-observality.yml
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/tempo/config.yml"
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/config.yml
              subPath: config.yml
            - name: data
              mountPath: /tmp/tempo
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-pvc

---
# ── 15. Service: Tempo ────────────────────────────────────────────
# Port 3200  → Grafana datasource query API
# Port 4317  → OTel Collector forwards traces here (internal only)
# NodePort 30200 → host 3200 for direct Tempo UI access
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
  labels:
    app: tempo
spec:
  type: NodePort
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
      nodePort: 30200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30417   # different from otel-collector's 30317
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30418   # different from otel-collector's 30318

---
# ── 16. Deployment: Prometheus ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsUser: 0   # matches user: "0" in docker-compose-observality.yml
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-remote-write-receiver"   # Tempo metrics_generator pushes here
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc

---
# ── 17. Service: Prometheus ──────────────────────────────────────
# NodePort 30090 → host 9090 (via kind extraPortMappings)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090

---
# ── 18. Deployment: OTel Collector ───────────────────────────────
# Receives telemetry from apps and fans out to Loki / Tempo / Prometheus.
# health_check extension (port 13133) is configured inside the ConfigMap
# so the readinessProbe can verify the collector is healthy via HTTP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/otelcol/config.yml"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: self-telemetry
              containerPort: 8888
            - name: prom-exporter
              containerPort: 8889
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol/config.yml
              subPath: config.yml
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
# ── 19. Service: OTel Collector ───────────────────────────────────
# External apps push telemetry to NodePort 30317 (gRPC) / 30318 (HTTP)
# which map to host ports 4317 / 4318 via kind extraPortMappings.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
    - name: self-telemetry
      port: 8888
      targetPort: 8888
      nodePort: 30888
    - name: prom-exporter
      port: 8889
      targetPort: 8889
      nodePort: 30889

---
# ── 20. Deployment: Grafana ──────────────────────────────────────
# Datasources and plugins are auto-provisioned from ConfigMaps
# so the UI is fully configured on first start — no manual setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4.0-22081664032
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            # Pre-install plugins synchronously before provisioning runs.
            # Without this, the background installer races against the
            # provisioning phase and "plugin not installed" errors occur.
            - name: GF_INSTALL_PLUGINS
              value: "grafana-lokiexplore-app,grafana-exploretraces-app"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
            - name: grafana-plugins
              mountPath: /etc/grafana/provisioning/plugins/plugins.yml
              subPath: plugins.yml
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-plugins
          configMap:
            name: grafana-plugins

---
# ── 21. Service: Grafana ─────────────────────────────────────────
# NodePort 30000 → host port 3000 (via kind extraPortMappings)
# This is the primary entry-point: http://localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
