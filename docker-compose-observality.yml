services:
  grafana:
    container_name: grafana
    image: grafana/grafana:12.4.0-22081664032
    ports:
      - "3000:3000"
    networks:
      - icontainer-network
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  loki:
    container_name: loki
    image: grafana/loki:3.2.0
    ports:
      - "3100:3100"
    networks:
      - icontainer-network
    command: ["-config.file=/etc/loki/local-config.yaml"]
    user: "0"  # run as root so bind-mount dirs are writable
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - /tmp/observability/loki:/loki

  tempo:
    container_name: tempo
    image: grafana/tempo:2.6.1
    ports:
      - "3200:3200"   # Tempo HTTP query API (used by Grafana datasource)
      - "4319:4317"   # OTLP gRPC exposed to host (optional, for direct pushes)
      - "4320:4318"   # OTLP HTTP exposed to host (optional)
    networks:
      - icontainer-network
    command: ["-config.file=/etc/tempo/config.yml"]
    user: "0"  # run as root so bind-mount dirs are writable
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yml:ro
      - /tmp/observability/tempo:/tmp/tempo

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    networks:
      - icontainer-network
    # --web.enable-remote-write-receiver lets Tempo's metrics-generator push span-metrics
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    user: "0"  # run as root so bind-mount dirs are writable
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /tmp/observability/prometheus:/prometheus

  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"  # OTLP gRPC receiver (backend app pushes here)
      - "4318:4318"  # OTLP HTTP receiver
      - "8888:8888"  # Collector self-telemetry (scraped by Prometheus)
      - "8889:8889"  # Prometheus exporter for app metrics (scraped by Prometheus)
    networks:
      - icontainer-network
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - loki
      - tempo

volumes:
  grafana-data:

networks:
  icontainer-network:
    external: true   # shared with docker-compose.yml so the API can reach otel-collector / loki / tempo
