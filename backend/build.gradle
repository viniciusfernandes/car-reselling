plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    // You can keep this, but it's optional when using the Spring Boot plugin
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'br.com.carreselling'
version = '1.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.opentelemetry:opentelemetry-bom:latest.release')
    // Web + Validation + Actuator + Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JPA (matches your spring.jpa.* config in application.yml)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // Mail (matches your spring.mail.* config)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Swagger/OpenAPI (Boot 3.3.x -> springdoc 2.6.x)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0' // :contentReference[oaicite:1]{index=1}

    // Observability – OpenTelemetry SDK (traces + metrics)
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry:opentelemetry-sdk-metrics'
    implementation 'io.opentelemetry:opentelemetry-sdk-logs'

    // Micrometer OTLP registry – pushes all Actuator metrics (JVM, HTTP, HikariCP…)
    // to the OTel Collector via OTLP/HTTP independently of the tracing toggle
    implementation 'io.micrometer:micrometer-registry-otlp'

    // Logs → Loki via loki4j (stable, no alpha dependencies)
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'


    // MySQL driver
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * Spring Boot executable jar customization
 * Output: build/libs/car-reselling-api-1.0.jar
 */
tasks.named('bootJar') {
    archiveBaseName.set('car-reselling-api')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('') // no "-plain" or "-all" suffix

    // Optional: if you have multiple main classes, uncomment and set explicitly:
    // mainClass.set('br.com.carreselling.CarResellingApplication')

    manifest {
        attributes(
                'Implementation-Title': 'Car Reselling API',
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.group
        )
    }

    // Optional: include extra files inside the jar under META-INF/
    // from('LICENSE') { into('META-INF') }
}

/**
 * Disable the plain jar (non-boot) by default to avoid generating two artifacts.
 * If you WANT the plain jar too, change enabled = true.
 */
tasks.named('jar') {
    enabled = false
    archiveBaseName.set('car-reselling-api')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('plain')
}