server:
  port: ${CAR_RESELLING_SERVER_PORT:8080}
  # When behind a reverse proxy (e.g. Nginx with HTTPS), use X-Forwarded-Proto so Swagger UI and the app see the correct scheme.
  forward-headers-strategy: framework

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CAR_RESELLING_DB_URL}
    username: ${CAR_RESELLING_DB_USERNAME}
    password: ${CAR_RESELLING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

storage:
  base-path: ${STORAGE_BASE_PATH}

logging:
  level:
    root: INFO

auth:
  base-url: ${AUTH_BASE_URL}

# CORS: comma-separated origin patterns; default * allows all (set in production for security).
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

tax:
  icms-rate: 0.12
  icms-base-rate: 0.05
  pis-rate: 0.0065
  cofins-rate: 0.03
  csll-rate: 0.0288
  irpj-rate: 0.048
  ir-commission-rate: 0.15

# Loki push URL used by the logback loki4j appender.
# Docker Compose sets LOKI_URL=http://loki:3100; the local profile overrides this to localhost.
loki:
  url: ${LOKI_URL}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace

  # Micrometer OTLP push – sends JVM, HTTP, HikariCP and all other Actuator metrics
  # to the OTel Collector regardless of whether tracing is enabled.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL}
        step: ${OTLP_METRICS_STEP:30s}
        resource-attributes:
          service.name: ${OBSERVABILITY_SERVICE_NAME:car-reselling-api}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
