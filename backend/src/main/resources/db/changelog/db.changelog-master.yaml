  - changeSet:
      id: vinicius-20260130-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN selling_price DECIMAL(13,2) NULL AFTER freight_cost;
  - changeSet:
      id: vinicius-20260206-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN purchase_commission DECIMAL(13,2) NOT NULL DEFAULT 0 AFTER freight_cost,
                ADD COLUMN distributed_at DATETIME NULL AFTER assigned_partner_id;

              UPDATE vehicles
              SET distributed_at = updated_at
              WHERE distributed_at IS NULL
                AND status IN ('DISTRIBUTED', 'SOLD');
  - changeSet:
      id: vinicius-20260211-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS brands (
                id CHAR(36) PRIMARY KEY,
                name VARCHAR(128) NOT NULL UNIQUE,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL
              );

              CREATE TABLE IF NOT EXISTS models (
                id CHAR(36) PRIMARY KEY,
                brand_id CHAR(36) NOT NULL,
                name VARCHAR(128) NOT NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL,
                UNIQUE KEY uk_models_brand_name (brand_id, name),
                KEY idx_models_brand (brand_id),
                CONSTRAINT fk_models_brand FOREIGN KEY (brand_id) REFERENCES brands(id)
              );

              ALTER TABLE vehicles
                ADD COLUMN brand_id CHAR(36) NULL AFTER brand,
                ADD COLUMN model_id CHAR(36) NULL AFTER brand_id,
                ADD KEY idx_vehicles_brand (brand_id),
                ADD KEY idx_vehicles_model (model_id);

              INSERT INTO brands (id, name, created_at)
              SELECT UUID(), v.brand, NOW()
              FROM (SELECT DISTINCT brand FROM vehicles) v
              LEFT JOIN brands b ON b.name = v.brand
              WHERE b.id IS NULL;

              INSERT INTO models (id, brand_id, name, created_at)
              SELECT UUID(), b.id, v.model, NOW()
              FROM (SELECT DISTINCT brand, model FROM vehicles) v
              JOIN brands b ON b.name = v.brand
              LEFT JOIN models m ON m.brand_id = b.id AND m.name = v.model
              WHERE m.id IS NULL;

              UPDATE vehicles v
              JOIN brands b ON b.name = v.brand
              JOIN models m ON m.brand_id = b.id AND m.name = v.model
              SET v.brand_id = b.id,
                  v.model_id = m.id;

              ALTER TABLE vehicles
                MODIFY brand_id CHAR(36) NOT NULL,
                MODIFY model_id CHAR(36) NOT NULL,
                ADD CONSTRAINT fk_vehicles_brand FOREIGN KEY (brand_id) REFERENCES brands(id),
                ADD CONSTRAINT fk_vehicles_model FOREIGN KEY (model_id) REFERENCES models(id);
  - changeSet:
      id: vinicius-20260221-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS colors (
                id CHAR(36) PRIMARY KEY,
                name VARCHAR(64) NOT NULL UNIQUE,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL
              );

              INSERT INTO colors (id, name, created_at)
              SELECT UUID(), UPPER(TRIM(v.color)), NOW()
              FROM (SELECT DISTINCT color FROM vehicles WHERE color IS NOT NULL AND TRIM(color) <> '') v
              LEFT JOIN colors c ON c.name = UPPER(TRIM(v.color))
              WHERE c.id IS NULL;
  - changeSet:
      id: vinicius-20260222-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE partners
                ADD COLUMN phone VARCHAR(32) NULL AFTER city,
                ADD COLUMN email VARCHAR(255) NULL AFTER phone;

              CREATE TABLE IF NOT EXISTS partner_history (
                id CHAR(36) PRIMARY KEY,
                partner_id CHAR(36) NOT NULL,
                name VARCHAR(255) NOT NULL,
                city VARCHAR(255) NULL,
                phone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                commission_rate DECIMAL(6,2) NULL,
                changed_at DATETIME NOT NULL,
                changed_by VARCHAR(128) NULL,
                KEY idx_partner_history_partner (partner_id),
                CONSTRAINT fk_partner_history_partner FOREIGN KEY (partner_id) REFERENCES partners(id)
              );
  - changeSet:
      id: vinicius-20260309-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE partners
                ADD COLUMN enabled BOOLEAN NOT NULL DEFAULT TRUE AFTER email;
  - changeSet:
      id: vinicius-20260313-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN sold_at DATE NULL AFTER distributed_at,
                ADD COLUMN sale_commission_rate DECIMAL(6,2) NULL AFTER sold_at;

              UPDATE vehicles
              SET sold_at = DATE(COALESCE(updated_at, created_at))
              WHERE status = 'SOLD' AND sold_at IS NULL;
  - changeSet:
      id: vinicius-20260317-02
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN on_service BOOLEAN NOT NULL DEFAULT TRUE AFTER status;

              UPDATE vehicles
              SET on_service = TRUE, status = 'IN_LOT'
              WHERE status = 'IN_SERVICE';

              CREATE INDEX idx_vehicles_on_service ON vehicles (on_service);
  - changeSet:
      id: vinicius-20260328-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS vehicle_on_service_history (
                id CHAR(36) PRIMARY KEY,
                vehicle_id CHAR(36) NOT NULL,
                on_service BOOLEAN NOT NULL,
                changed_at DATETIME NOT NULL,
                KEY idx_on_service_history_vehicle (vehicle_id),
                CONSTRAINT fk_on_service_history_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id)
              );

              INSERT INTO vehicle_on_service_history (id, vehicle_id, on_service, changed_at)
              SELECT UUID(), id, TRUE, created_at
              FROM vehicles;

  - changeSet:
      id: vinicius-20260211-07
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE services
                ADD COLUMN start_date DATE NULL,
                ADD COLUMN end_date DATE NULL AFTER start_date;

              UPDATE services
              SET start_date = COALESCE(performed_at, DATE(created_at));

              ALTER TABLE services
                MODIFY COLUMN start_date DATE NOT NULL;

              ALTER TABLE vehicles
                DROP INDEX idx_vehicles_on_service,
                DROP COLUMN on_service;

  - changeSet:
      id: vinicius-20260211-08
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE services
                DROP COLUMN performed_at;
              
