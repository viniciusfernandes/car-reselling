databaseChangeLog:
  - changeSet:
      id: initial-schema-01
      author: vinicius
      comment: Consolidated schema. All primary keys and foreign keys (except company_id) are native UUID.
      changes:
        - sql:
            sql: |
              CREATE TABLE companies (
                company_id SMALLINT PRIMARY KEY,
                name VARCHAR(50) NOT NULL,
                active BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL
              );

              CREATE TABLE partners (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                name VARCHAR(255) NOT NULL UNIQUE,
                city VARCHAR(255) NULL,
                phone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                commission_rate DECIMAL(6,2) NULL,
                enabled BOOLEAN NOT NULL DEFAULT TRUE,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_partners_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_partners_company ON partners (company_id);

              CREATE TABLE partner_history (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                partner_id UUID NOT NULL,
                name VARCHAR(255) NOT NULL,
                city VARCHAR(255) NULL,
                phone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                commission_rate DECIMAL(6,2) NULL,
                changed_at TIMESTAMP NOT NULL,
                changed_by VARCHAR(128) NULL,
                CONSTRAINT fk_partner_history_partner FOREIGN KEY (partner_id) REFERENCES partners(id),
                CONSTRAINT fk_partner_history_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_partner_history_partner ON partner_history (partner_id);
              CREATE INDEX idx_partner_history_company ON partner_history (company_id);

              CREATE TABLE brands (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                name VARCHAR(128) NOT NULL UNIQUE,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_brands_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_brands_company ON brands (company_id);

              CREATE TABLE models (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                brand_id UUID NOT NULL,
                name VARCHAR(128) NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT uk_models_brand_name UNIQUE (brand_id, name),
                CONSTRAINT fk_models_brand FOREIGN KEY (brand_id) REFERENCES brands(id),
                CONSTRAINT fk_models_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_models_brand ON models (brand_id);
              CREATE INDEX idx_models_company ON models (company_id);

              CREATE TABLE colors (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                name VARCHAR(64) NOT NULL UNIQUE,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_colors_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_colors_company ON colors (company_id);

              CREATE TABLE vehicles (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                license_plate VARCHAR(16) NOT NULL UNIQUE,
                renavam VARCHAR(32) NULL UNIQUE,
                vin VARCHAR(64) NULL UNIQUE,
                year INT NOT NULL,
                color VARCHAR(64) NOT NULL,
                model VARCHAR(128) NOT NULL,
                brand VARCHAR(128) NOT NULL,
                brand_id UUID NOT NULL,
                model_id UUID NOT NULL,
                supplier_source VARCHAR(32) NOT NULL,
                purchase_price DECIMAL(13,2) NOT NULL,
                freight_cost DECIMAL(13,2) NOT NULL DEFAULT 0,
                purchase_commission DECIMAL(13,2) NOT NULL DEFAULT 0,
                selling_price DECIMAL(13,2) NULL,
                valor_fipe DECIMAL(13,2) NULL,
                purchase_payment_receipt_document_id UUID NULL,
                purchase_invoice_document_id UUID NULL,
                status VARCHAR(32) NOT NULL,
                assigned_partner_id UUID NULL,
                distributed_at TIMESTAMP NULL,
                sold_at DATE NULL,
                sale_commission_rate DECIMAL(6,2) NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_vehicles_partner FOREIGN KEY (assigned_partner_id) REFERENCES partners(id),
                CONSTRAINT fk_vehicles_brand FOREIGN KEY (brand_id) REFERENCES brands(id),
                CONSTRAINT fk_vehicles_model FOREIGN KEY (model_id) REFERENCES models(id),
                CONSTRAINT fk_vehicles_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_vehicles_status ON vehicles (status);
              CREATE INDEX idx_vehicles_plate ON vehicles (license_plate);
              CREATE INDEX idx_vehicles_partner ON vehicles (assigned_partner_id);
              CREATE INDEX idx_vehicles_brand ON vehicles (brand_id);
              CREATE INDEX idx_vehicles_model ON vehicles (model_id);
              CREATE INDEX idx_vehicles_company ON vehicles (company_id);

              CREATE TABLE vehicle_on_service_history (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                vehicle_id UUID NOT NULL,
                on_service BOOLEAN NOT NULL,
                changed_at TIMESTAMP NOT NULL,
                CONSTRAINT fk_on_service_history_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id),
                CONSTRAINT fk_on_service_history_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_on_service_history_vehicle ON vehicle_on_service_history (vehicle_id);
              CREATE INDEX idx_on_service_history_company ON vehicle_on_service_history (company_id);

              CREATE TABLE services (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                vehicle_id UUID NOT NULL,
                service_type VARCHAR(32) NOT NULL,
                description VARCHAR(500) NULL,
                service_value DECIMAL(13,2) NOT NULL,
                start_date DATE NOT NULL,
                end_date DATE NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_services_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id),
                CONSTRAINT fk_services_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_services_vehicle ON services (vehicle_id);
              CREATE INDEX idx_services_company ON services (company_id);

              CREATE TABLE documents (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                vehicle_id UUID NOT NULL,
                document_type VARCHAR(32) NOT NULL,
                original_file_name VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                size_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                uploaded_at TIMESTAMP NOT NULL,
                uploaded_by VARCHAR(128) NULL,
                CONSTRAINT fk_documents_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id),
                CONSTRAINT fk_documents_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_documents_vehicle ON documents (vehicle_id);
              CREATE INDEX idx_documents_company ON documents (company_id);

              CREATE TABLE payments (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                payment_type VARCHAR(32) NOT NULL,
                description VARCHAR(500) NULL,
                amount DECIMAL(13,2) NOT NULL,
                payment_date DATE NOT NULL,
                vehicle_id UUID NULL,
                notes VARCHAR(1000) NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NULL,
                CONSTRAINT fk_payments_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id),
                CONSTRAINT fk_payments_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_payments_type ON payments (payment_type);
              CREATE INDEX idx_payments_date ON payments (payment_date);
              CREATE INDEX idx_payments_vehicle ON payments (vehicle_id);
              CREATE INDEX idx_payments_company ON payments (company_id);

              CREATE TABLE payment_documents (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                payment_id UUID NOT NULL,
                original_file_name VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                size_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                uploaded_at TIMESTAMP NOT NULL,
                uploaded_by VARCHAR(128) NULL,
                CONSTRAINT fk_payment_documents_payment FOREIGN KEY (payment_id) REFERENCES payments(id),
                CONSTRAINT fk_payment_documents_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_payment_documents_payment ON payment_documents (payment_id);
              CREATE INDEX idx_payment_documents_company ON payment_documents (company_id);

              CREATE TABLE cash_balance (
                company_id SMALLINT PRIMARY KEY,
                amount DECIMAL(13,2) NOT NULL DEFAULT 0,
                updated_at TIMESTAMP NOT NULL,
                CONSTRAINT fk_cash_balance_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE TABLE cash_balance_history (
                id UUID PRIMARY KEY,
                company_id SMALLINT NOT NULL,
                amount DECIMAL(13,2) NOT NULL,
                changed_at TIMESTAMP NOT NULL,
                changed_by VARCHAR(255) NULL,
                CONSTRAINT fk_cash_balance_history_company FOREIGN KEY (company_id) REFERENCES companies(company_id)
              );

              CREATE INDEX idx_cash_balance_history_changed_at ON cash_balance_history (changed_at);
              CREATE INDEX idx_cash_balance_history_company ON cash_balance_history (company_id);
