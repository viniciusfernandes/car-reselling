databaseChangeLog:
  - changeSet:
      id: vinicius-20260123-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS partners (
                id CHAR(36) PRIMARY KEY,
                name VARCHAR(255) NOT NULL UNIQUE,
                city VARCHAR(255) NULL,
                commission_rate DECIMAL(6,2) NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL
              );

              CREATE TABLE IF NOT EXISTS vehicles (
                id CHAR(36) PRIMARY KEY,
                license_plate VARCHAR(16) NOT NULL UNIQUE,
                renavam VARCHAR(32) NULL UNIQUE,
                vin VARCHAR(64) NULL UNIQUE,
                year INT NOT NULL,
                color VARCHAR(64) NOT NULL,
                model VARCHAR(128) NOT NULL,
                brand VARCHAR(128) NOT NULL,
                supplier_source VARCHAR(32) NOT NULL,
                purchase_price DECIMAL(13,2) NOT NULL,
                freight_cost DECIMAL(13,2) NOT NULL DEFAULT 0,
                purchase_payment_receipt_document_id CHAR(36) NULL,
                purchase_invoice_document_id CHAR(36) NULL,
                status VARCHAR(32) NOT NULL,
                assigned_partner_id CHAR(36) NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL,
                KEY idx_vehicles_status (status),
                KEY idx_vehicles_plate (license_plate),
                KEY idx_vehicles_partner (assigned_partner_id),
                CONSTRAINT fk_vehicles_partner FOREIGN KEY (assigned_partner_id) REFERENCES partners(id)
              );

              CREATE TABLE IF NOT EXISTS services (
                id CHAR(36) PRIMARY KEY,
                vehicle_id CHAR(36) NOT NULL,
                service_type VARCHAR(32) NOT NULL,
                description VARCHAR(500) NULL,
                service_value DECIMAL(13,2) NOT NULL,
                performed_at DATE NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL,
                KEY idx_services_vehicle (vehicle_id),
                CONSTRAINT fk_services_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id)
              );

              CREATE TABLE IF NOT EXISTS documents (
                id CHAR(36) PRIMARY KEY,
                vehicle_id CHAR(36) NOT NULL,
                document_type VARCHAR(32) NOT NULL,
                original_file_name VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                size_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                uploaded_at DATETIME NOT NULL,
                uploaded_by VARCHAR(128) NULL,
                KEY idx_documents_vehicle (vehicle_id),
                CONSTRAINT fk_documents_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id)
              );

  - changeSet:
      id: vinicius-20260130-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN selling_price DECIMAL(13,2) NULL AFTER freight_cost;
  - changeSet:
      id: vinicius-20260206-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN purchase_commission DECIMAL(13,2) NOT NULL DEFAULT 0 AFTER freight_cost,
                ADD COLUMN distributed_at DATETIME NULL AFTER assigned_partner_id;

              UPDATE vehicles
              SET distributed_at = updated_at
              WHERE distributed_at IS NULL
                AND status IN ('DISTRIBUTED', 'SOLD');
  - changeSet:
      id: vinicius-20260211-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS brands (
                id CHAR(36) PRIMARY KEY,
                name VARCHAR(128) NOT NULL UNIQUE,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL
              );

              CREATE TABLE IF NOT EXISTS models (
                id CHAR(36) PRIMARY KEY,
                brand_id CHAR(36) NOT NULL,
                name VARCHAR(128) NOT NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL,
                UNIQUE KEY uk_models_brand_name (brand_id, name),
                KEY idx_models_brand (brand_id),
                CONSTRAINT fk_models_brand FOREIGN KEY (brand_id) REFERENCES brands(id)
              );

              ALTER TABLE vehicles
                ADD COLUMN brand_id CHAR(36) NULL AFTER brand,
                ADD COLUMN model_id CHAR(36) NULL AFTER brand_id,
                ADD KEY idx_vehicles_brand (brand_id),
                ADD KEY idx_vehicles_model (model_id);

              ALTER TABLE vehicles
                MODIFY brand_id CHAR(36) NOT NULL,
                MODIFY model_id CHAR(36) NOT NULL,
                ADD CONSTRAINT fk_vehicles_brand FOREIGN KEY (brand_id) REFERENCES brands(id),
                ADD CONSTRAINT fk_vehicles_model FOREIGN KEY (model_id) REFERENCES models(id);
  - changeSet:
      id: vinicius-20260221-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS colors (
                id CHAR(36) PRIMARY KEY,
                name VARCHAR(64) NOT NULL UNIQUE,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL
              );

  - changeSet:
      id: vinicius-20260222-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE partners
                ADD COLUMN phone VARCHAR(32) NULL AFTER city,
                ADD COLUMN email VARCHAR(255) NULL AFTER phone;

              CREATE TABLE IF NOT EXISTS partner_history (
                id CHAR(36) PRIMARY KEY,
                partner_id CHAR(36) NOT NULL,
                name VARCHAR(255) NOT NULL,
                city VARCHAR(255) NULL,
                phone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                commission_rate DECIMAL(6,2) NULL,
                changed_at DATETIME NOT NULL,
                changed_by VARCHAR(128) NULL,
                KEY idx_partner_history_partner (partner_id),
                CONSTRAINT fk_partner_history_partner FOREIGN KEY (partner_id) REFERENCES partners(id)
              );
  - changeSet:
      id: vinicius-20260309-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE partners
                ADD COLUMN enabled BOOLEAN NOT NULL DEFAULT TRUE AFTER email;
  - changeSet:
      id: vinicius-20260313-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN sold_at DATE NULL AFTER distributed_at,
                ADD COLUMN sale_commission_rate DECIMAL(6,2) NULL AFTER sold_at;

              UPDATE vehicles
              SET sold_at = DATE(COALESCE(updated_at, created_at))
              WHERE status = 'SOLD' AND sold_at IS NULL;
  - changeSet:
      id: vinicius-20260317-02
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE vehicles
                ADD COLUMN on_service BOOLEAN NOT NULL DEFAULT TRUE AFTER status;

              UPDATE vehicles
              SET on_service = TRUE, status = 'IN_LOT'
              WHERE status = 'IN_SERVICE';

              CREATE INDEX idx_vehicles_on_service ON vehicles (on_service);
  - changeSet:
      id: vinicius-20260328-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS vehicle_on_service_history (
                id CHAR(36) PRIMARY KEY,
                vehicle_id CHAR(36) NOT NULL,
                on_service BOOLEAN NOT NULL,
                changed_at DATETIME NOT NULL,
                KEY idx_on_service_history_vehicle (vehicle_id),
                CONSTRAINT fk_on_service_history_vehicle FOREIGN KEY (vehicle_id) REFERENCES vehicles(id)
              );

  - changeSet:
      id: vinicius-20260211-07
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE services
                ADD COLUMN start_date DATE NULL,
                ADD COLUMN end_date DATE NULL AFTER start_date;

              UPDATE services
              SET start_date = COALESCE(performed_at, DATE(created_at));

              ALTER TABLE services
                MODIFY COLUMN start_date DATE NOT NULL;

              ALTER TABLE vehicles
                DROP INDEX idx_vehicles_on_service,
                DROP COLUMN on_service;

  - changeSet:
      id: vinicius-20260211-08
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE services
                DROP COLUMN performed_at;

  - changeSet:
      id: vinicius-20260517-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS payments (
                id CHAR(36) PRIMARY KEY,
                payment_type VARCHAR(32) NOT NULL,
                description VARCHAR(500) NULL,
                amount DECIMAL(13,2) NOT NULL,
                payment_date DATE NOT NULL,
                vehicle_id CHAR(36) NULL,
                reference_month CHAR(7) NULL,
                notes VARCHAR(1000) NULL,
                created_at DATETIME NOT NULL,
                updated_at DATETIME NULL,
                KEY idx_payments_type (payment_type),
                KEY idx_payments_date (payment_date),
                KEY idx_payments_vehicle (vehicle_id),
                KEY idx_payments_month (reference_month)
              );

              CREATE TABLE IF NOT EXISTS payment_documents (
                id CHAR(36) PRIMARY KEY,
                payment_id CHAR(36) NOT NULL,
                original_file_name VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                size_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                uploaded_at DATETIME NOT NULL,
                uploaded_by VARCHAR(128) NULL,
                KEY idx_payment_documents_payment (payment_id),
                CONSTRAINT fk_payment_documents_payment FOREIGN KEY (payment_id) REFERENCES payments(id)
              );

  - changeSet:
      id: vinicius-20260518-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE payments
                ADD COLUMN reference_year  INT NULL,
                ADD COLUMN reference_month_new INT NULL;

              UPDATE payments
              SET reference_year      = CAST(SUBSTRING(reference_month, 1, 4) AS UNSIGNED),
                  reference_month_new = CAST(SUBSTRING(reference_month, 6, 2) AS UNSIGNED)
              WHERE reference_month IS NOT NULL;

              ALTER TABLE payments
                DROP INDEX idx_payments_month,
                DROP COLUMN reference_month;

              ALTER TABLE payments
                CHANGE COLUMN reference_month_new reference_month INT NULL;

              CREATE INDEX idx_payments_year_month ON payments (reference_year, reference_month);

  - changeSet:
      id: vinicius-20260601-01
      author: vinicius
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS cash_balance (
                amount DECIMAL(13,2) NOT NULL DEFAULT 0,
                updated_at DATETIME NOT NULL
              );

              CREATE TABLE IF NOT EXISTS cash_balance_history (
                id CHAR(36) PRIMARY KEY,
                amount DECIMAL(13,2) NOT NULL,
                changed_at DATETIME NOT NULL,
                changed_by VARCHAR(255) NULL,
                KEY idx_cash_balance_history_changed_at (changed_at)
              );

              INSERT INTO cash_balance (amount, updated_at)
              VALUES (0, NOW());

  - changeSet:
      id: vinicius-20260605-01
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE payments
                DROP INDEX idx_payments_year_month,
                DROP COLUMN reference_year,
                DROP COLUMN reference_month;

  - changeSet:
      id: vinicius-20260605-02
      author: vinicius
      changes:
        - sql:
            sql: |
              ALTER TABLE payments
                ADD CONSTRAINT fk_payments_vehicle
                  FOREIGN KEY (vehicle_id) REFERENCES vehicles(id);

