databaseChangeLog:
  - changeSet:
      id: initial-schema-01
      author: vinicius
      comment: Consolidated schema. All primary keys and foreign keys (except empresa_id) are native UUID.
      changes:
        - sql:
            sql: |
              -- All tables of the car reselling bounded context live in the "revenda" schema
              CREATE SCHEMA IF NOT EXISTS revenda;

              CREATE TABLE revenda.empresas (
                empresa_id SMALLINT PRIMARY KEY,
                nome VARCHAR(50) NOT NULL,
                ativo BOOLEAN NOT NULL DEFAULT TRUE,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL
              );

              CREATE TABLE revenda.parceiros (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                nome VARCHAR(255) NOT NULL UNIQUE,
                cidade VARCHAR(255) NULL,
                telefone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                taxa_comissao DECIMAL(6,2) NULL,
                habilitado BOOLEAN NOT NULL DEFAULT TRUE,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_parceiros_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_parceiros_empresa ON revenda.parceiros (empresa_id);

              CREATE TABLE revenda.historico_parceiro (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                parceiro_id UUID NOT NULL,
                nome VARCHAR(255) NOT NULL,
                cidade VARCHAR(255) NULL,
                telefone VARCHAR(32) NULL,
                email VARCHAR(255) NULL,
                taxa_comissao DECIMAL(6,2) NULL,
                alterado_em TIMESTAMP NOT NULL,
                alterado_por VARCHAR(128) NULL,
                CONSTRAINT fk_historico_parceiro_parceiro FOREIGN KEY (parceiro_id) REFERENCES revenda.parceiros(id),
                CONSTRAINT fk_historico_parceiro_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_historico_parceiro_parceiro ON revenda.historico_parceiro (parceiro_id);
              CREATE INDEX idx_historico_parceiro_empresa ON revenda.historico_parceiro (empresa_id);

              CREATE TABLE revenda.marcas (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                nome VARCHAR(128) NOT NULL UNIQUE,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_marcas_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_marcas_empresa ON revenda.marcas (empresa_id);

              CREATE TABLE revenda.modelos (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                marca_id UUID NOT NULL,
                nome VARCHAR(128) NOT NULL,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT uk_modelos_marca_nome UNIQUE (marca_id, nome),
                CONSTRAINT fk_modelos_marca FOREIGN KEY (marca_id) REFERENCES revenda.marcas(id),
                CONSTRAINT fk_modelos_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_modelos_marca ON revenda.modelos (marca_id);
              CREATE INDEX idx_modelos_empresa ON revenda.modelos (empresa_id);

              CREATE TABLE revenda.cores (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                nome VARCHAR(64) NOT NULL UNIQUE,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_cores_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_cores_empresa ON revenda.cores (empresa_id);

              CREATE TABLE revenda.veiculos (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                placa VARCHAR(16) NOT NULL UNIQUE,
                renavam VARCHAR(32) NULL UNIQUE,
                chassi VARCHAR(64) NULL UNIQUE,
                ano INT NOT NULL,
                cor VARCHAR(64) NOT NULL,
                modelo VARCHAR(128) NOT NULL,
                marca VARCHAR(128) NOT NULL,
                marca_id UUID NOT NULL,
                modelo_id UUID NOT NULL,
                origem_fornecedor VARCHAR(32) NOT NULL,
                preco_compra DECIMAL(13,2) NOT NULL,
                custo_frete DECIMAL(13,2) NOT NULL DEFAULT 0,
                comissao_compra DECIMAL(13,2) NOT NULL DEFAULT 0,
                preco_venda DECIMAL(13,2) NULL,
                valor_fipe DECIMAL(13,2) NULL,
                documento_comprovante_pagamento_compra_id UUID NULL,
                documento_nota_fiscal_compra_id UUID NULL,
                status VARCHAR(32) NOT NULL,
                parceiro_atribuido_id UUID NULL,
                distribuido_em TIMESTAMP NULL,
                data_venda DATE NULL,
                taxa_comissao_venda DECIMAL(6,2) NULL,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_veiculos_parceiro FOREIGN KEY (parceiro_atribuido_id) REFERENCES revenda.parceiros(id),
                CONSTRAINT fk_veiculos_marca FOREIGN KEY (marca_id) REFERENCES revenda.marcas(id),
                CONSTRAINT fk_veiculos_modelo FOREIGN KEY (modelo_id) REFERENCES revenda.modelos(id),
                CONSTRAINT fk_veiculos_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_veiculos_status ON revenda.veiculos (status);
              CREATE INDEX idx_veiculos_plate ON revenda.veiculos (placa);
              CREATE INDEX idx_veiculos_parceiro ON revenda.veiculos (parceiro_atribuido_id);
              CREATE INDEX idx_veiculos_marca ON revenda.veiculos (marca_id);
              CREATE INDEX idx_veiculos_modelo ON revenda.veiculos (modelo_id);
              CREATE INDEX idx_veiculos_empresa ON revenda.veiculos (empresa_id);

              CREATE TABLE revenda.historico_veiculo_em_servico (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                veiculo_id UUID NOT NULL,
                em_servico BOOLEAN NOT NULL,
                alterado_em TIMESTAMP NOT NULL,
                CONSTRAINT fk_em_servico_historico_veiculo FOREIGN KEY (veiculo_id) REFERENCES revenda.veiculos(id),
                CONSTRAINT fk_em_servico_historico_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_em_servico_historico_veiculo ON revenda.historico_veiculo_em_servico (veiculo_id);
              CREATE INDEX idx_em_servico_historico_empresa ON revenda.historico_veiculo_em_servico (empresa_id);

              CREATE TABLE revenda.servicos (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                veiculo_id UUID NOT NULL,
                tipo_servico VARCHAR(32) NOT NULL,
                descricao VARCHAR(500) NULL,
                valor_servico DECIMAL(13,2) NOT NULL,
                data_inicio DATE NOT NULL,
                data_fim DATE NULL,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_servicos_veiculo FOREIGN KEY (veiculo_id) REFERENCES revenda.veiculos(id),
                CONSTRAINT fk_servicos_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_servicos_veiculo ON revenda.servicos (veiculo_id);
              CREATE INDEX idx_servicos_empresa ON revenda.servicos (empresa_id);

              CREATE TABLE revenda.documentos (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                veiculo_id UUID NOT NULL,
                tipo_documento VARCHAR(32) NOT NULL,
                nome_original_arquivo VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                tamanho_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                enviado_em TIMESTAMP NOT NULL,
                enviado_por VARCHAR(128) NULL,
                CONSTRAINT fk_documentos_veiculo FOREIGN KEY (veiculo_id) REFERENCES revenda.veiculos(id),
                CONSTRAINT fk_documentos_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_documentos_veiculo ON revenda.documentos (veiculo_id);
              CREATE INDEX idx_documentos_empresa ON revenda.documentos (empresa_id);

              CREATE TABLE revenda.pagamentos (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                tipo_pagamento VARCHAR(32) NOT NULL,
                descricao VARCHAR(500) NULL,
                valor DECIMAL(13,2) NOT NULL,
                data_pagamento DATE NOT NULL,
                veiculo_id UUID NULL,
                observacoes VARCHAR(1000) NULL,
                criado_em TIMESTAMP NOT NULL,
                atualizado_em TIMESTAMP NULL,
                CONSTRAINT fk_pagamentos_veiculo FOREIGN KEY (veiculo_id) REFERENCES revenda.veiculos(id),
                CONSTRAINT fk_pagamentos_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_pagamentos_type ON revenda.pagamentos (tipo_pagamento);
              CREATE INDEX idx_pagamentos_date ON revenda.pagamentos (data_pagamento);
              CREATE INDEX idx_pagamentos_veiculo ON revenda.pagamentos (veiculo_id);
              CREATE INDEX idx_pagamentos_empresa ON revenda.pagamentos (empresa_id);

              CREATE TABLE revenda.documentos_pagamento (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                pagamento_id UUID NOT NULL,
                nome_original_arquivo VARCHAR(512) NOT NULL,
                content_type VARCHAR(255) NOT NULL,
                tamanho_bytes BIGINT NOT NULL,
                storage_key VARCHAR(1024) NOT NULL,
                enviado_em TIMESTAMP NOT NULL,
                enviado_por VARCHAR(128) NULL,
                CONSTRAINT fk_documentos_pagamento_pagamento FOREIGN KEY (pagamento_id) REFERENCES revenda.pagamentos(id),
                CONSTRAINT fk_documentos_pagamento_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_documentos_pagamento_pagamento ON revenda.documentos_pagamento (pagamento_id);
              CREATE INDEX idx_documentos_pagamento_empresa ON revenda.documentos_pagamento (empresa_id);

              CREATE TABLE revenda.saldo_caixa (
                empresa_id SMALLINT PRIMARY KEY,
                valor DECIMAL(13,2) NOT NULL DEFAULT 0,
                atualizado_em TIMESTAMP NOT NULL,
                CONSTRAINT fk_saldo_caixa_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE TABLE revenda.historico_saldo_caixa (
                id UUID PRIMARY KEY,
                empresa_id SMALLINT NOT NULL,
                valor DECIMAL(13,2) NOT NULL,
                alterado_em TIMESTAMP NOT NULL,
                alterado_por VARCHAR(255) NULL,
                CONSTRAINT fk_historico_saldo_caixa_empresa FOREIGN KEY (empresa_id) REFERENCES revenda.empresas(empresa_id)
              );

              CREATE INDEX idx_historico_saldo_caixa_alterado_em ON revenda.historico_saldo_caixa (alterado_em);
              CREATE INDEX idx_historico_saldo_caixa_empresa ON revenda.historico_saldo_caixa (empresa_id);
