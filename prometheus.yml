global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # OTel Collector self-telemetry (pipeline health, spans/metrics processed, errors, etc.)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # Application metrics forwarded by the OTel Collector via its Prometheus exporter.
  # honor_labels: true preserves the job/instance labels that the OTel SDK already
  # sets via resource attributes (e.g. job="car-reselling-api"), so PromQL queries
  # like {job="car-reselling-api"} work as expected.
  - job_name: "otel-collector-app-metrics"
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
