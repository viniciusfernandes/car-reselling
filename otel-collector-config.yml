receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  # ---- LOGS → LOKI ----
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # ---- TRACES → TEMPO ----
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ---- METRICS → PROMETHEUS ----
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
