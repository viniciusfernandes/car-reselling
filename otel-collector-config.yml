receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

  # Copy the service.name resource attribute down to every datapoint as a
  # service_name label so Prometheus queries like {service_name="car-reselling-api"}
  # work consistently with the same label used in Loki.
  transform/resource_to_labels:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service_name"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil

exporters:
  debug:
    verbosity: detailed
  # ---- LOGS → LOKI ----
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # ---- TRACES → TEMPO ----
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ---- METRICS → PROMETHEUS ----
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch, transform/resource_to_labels]
      exporters: [prometheus]
