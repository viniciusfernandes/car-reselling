services:
  mysql:
    container_name: mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: car_reselling
      MYSQL_USER: car
      MYSQL_PASSWORD: car
      MYSQL_ROOT_PASSWORD: car
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcar"]
      interval: 10s
      timeout: 5s
      retries: 5

  car-reselling-api:
    container_name: car-reselling-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    # So the container can reach the host (e.g. auth API running in IntelliJ on port 8081).
    # Required on Linux; harmless on Docker Desktop (Mac/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - car-reselling-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/car_reselling?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: car
      SPRING_DATASOURCE_PASSWORD: car
      # Observability – enabled by default in Docker; all targets resolve via container name
      OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://otel-collector:4318/v1/metrics}
      OBSERVABILITY_TRACING_ENABLED: ${OBSERVABILITY_TRACING_ENABLED:-false}
      OBSERVABILITY_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-http://otel-collector:4317}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-change-me}
    volumes:
      - ./storage:/storage
    depends_on:
      mysql:
        condition: service_healthy

  car-reselling-ui:
    container_name: car-reselling-ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - car-reselling-api

  authentication-api:
    container_name: authentication-api
    build:
      context: ../authentication-api
      dockerfile: Dockerfile
    ports:
      - "8081:8080"   # app listens on container port 8080; exposed as 8081 on the host
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-change-me}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: car
      JWT_SECRET: ${JWT_SECRET:-change-me}
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FACEBOOK_CLIENT_ID: ""
      FACEBOOK_CLIENT_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000"

volumes:
  mysql-data:

networks:
  car-reselling-net:
    external: true   # shared with docker-compose-observality.yml so the API can reach otel-collector / loki / tempo
