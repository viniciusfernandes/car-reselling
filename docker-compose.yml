services:
  mysql:
    container_name: mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${CAR_RESELLING_DB}
      MYSQL_USER: ${CAR_RESELLING_DB_USERNAME}
      MYSQL_PASSWORD: ${CAR_RESELLING_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CAR_RESELLING_DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - car_reselling_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcar"]
      interval: 10s
      timeout: 5s
      retries: 5

  car-reselling-api:
    container_name: car-reselling-api
    image: viniciussf/car-reselling-api:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - car_reselling_network
    environment:
      CAR_RESELLING_DB_URL: ${CAR_RESELLING_DB_URL}
      CAR_RESELLING_DB_USERNAME: ${CAR_RESELLING_DB_USERNAME}
      CAR_RESELLING_DB_PASSWORD: ${CAR_RESELLING_DB_PASSWORD}
      # Observability – enabled by default in Docker; all targets resolve via container name
      OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-http://otel-collector:4318/v1/metrics}
      OBSERVABILITY_TRACING_ENABLED: ${OBSERVABILITY_TRACING_ENABLED:-false}
      OBSERVABILITY_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-http://otel-collector:4317}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-change-me}
    volumes:
      - ./storage:/storage
    depends_on:
      mysql:
        condition: service_healthy

  car-reselling-ui:
    container_name: car-reselling-ui
    image: viniciussf/car-reselling-ui:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - car_reselling_network
    depends_on:
      - car-reselling-api

  authentication-api:
    container_name: authentication-api
    image: viniciussf/authentication-api:latest
    build:
      context: ../authentication-api
      dockerfile: Dockerfile
    ports:
      - "8081:8080"   # app listens on container port 8080; exposed as 8081 on the host
      - "8000:8000"
    networks:
      - car_reselling_network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-change-me}
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: car
      JWT_SECRET: ${JWT_SECRET:-change-me}
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      FACEBOOK_CLIENT_ID: ""
      FACEBOOK_CLIENT_SECRET: ""
      FRONTEND_URL: http://localhost:3000
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000"

volumes:
  mysql-data:

networks:
  car_reselling_network:
    name: icontainer-network
    external: true